name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチへの連続 push では古い実行を打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # UT は Docker を待たないので数秒で結果が返る。IT とは並列に走らせる。
  ut:
    name: UT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ルートの typecheck は packages/web を対象外にしている（jsx 設定が別）。
      - name: Typecheck
        run: |
          pnpm typecheck
          pnpm --filter @test/web typecheck

      # GitHub Actions は CI=true を自動で設定するので、
      # JUnit XML の出力とカバレッジ 100% 閾値がそのまま有効になる。
      - name: Run UT
        run: pnpm test:ut

      - name: Upload UT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ut-results
          path: |
            .test-result/ut-junit.xml
            coverage/ut
          if-no-files-found: warn
          retention-days: 7

  it:
    name: IT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ローカルと同じ compose を使う。global-setup.ts が
      # `docker compose run --rm flyway` を呼ぶため、compose ネットワークが要る。
      - name: Start containers
        run: pnpm docker:up

      - name: Run IT
        run: pnpm test:it

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color --tail=200

      - name: Upload IT results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-results
          path: .test-result/it-junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Stop containers
        if: always()
        run: pnpm docker:down

  # 実アプリ（Hono API + React SPA）に対して動かす。
  # IT と同じ compose を使うが、DB とテーブルは別（db_e2e / events_e2e）。
  # アプリの起動は playwright.config.ts の webServer が行う。
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ルートの typecheck は packages/e2e と packages/web を対象外にしている。
      - name: Typecheck
        run: |
          pnpm --filter @test/e2e typecheck
          pnpm --filter @test/web typecheck

      # ブラウザ本体は 100MB 超あるので、lockfile が変わらない限り使い回す。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # キャッシュヒット時もブラウザのダウンロードだけが省かれ、
      # OS 側の依存ライブラリの導入は毎回走る。
      - name: Install Chromium
        run: pnpm --filter @test/e2e exec playwright install --with-deps chromium

      - name: Start containers
        run: pnpm docker:up

      # SPA をビルドし、DB を作り直してシードしてから Playwright を起動する。
      - name: Run E2E
        run: pnpm test:e2e

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --no-color --tail=200

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            .test-result/e2e-junit.xml
            packages/e2e/playwright-report
            packages/e2e/test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Stop containers
        if: always()
        run: pnpm docker:down
